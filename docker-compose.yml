version: '3.8'

services:
  cheat-clip-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cheat-clip-pro
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SUPADATA_API_KEYS=${SUPADATA_API_KEYS:-}
      - WEBSHARE_PROXY=${WEBSHARE_PROXY:-}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-http://localhost:8000/api/youtube/callback}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-http://localhost:8000/api/tiktok/callback}
    volumes:
      - media_temp:/app/temp
      - media_uploads:/app/uploads
      - media_exports:/app/exports
      - custom_fonts:/app/fonts
      - youtube_auth:/app/backend/youtube_auth
      - tiktok_auth:/app/backend/tiktok_auth
    deploy:
      resources:
        limits:
          memory: 3200M

volumes:
  media_temp:
  media_uploads:
  media_exports:
  custom_fonts:
  youtube_auth:
  tiktok_auth:
